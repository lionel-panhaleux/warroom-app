name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # DEPLOY_SSH_KEY is a secret; DEPLOY_HOST and DEPLOY_HOST_KEY are variables
    # (pushed by server-setup's `just sync`)
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: npm ci && npm run build

      - name: Install Ansible
        working-directory: ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts

      - name: Deploy
        working-directory: ansible
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: >-
          ansible-playbook deploy.yml -i "$DEPLOY_HOST,"
          --user deploy --private-key ~/.ssh/deploy
