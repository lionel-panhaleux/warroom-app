<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <clipPath id="c-italy">
      <circle cx="24" cy="24" r="23"/>
    </clipPath>
  </defs>
  <g clip-path="url(#c-italy)">
    <!-- Green stripe -->
    <rect x="0" y="0" width="16" height="48" fill="#009246"/>
    <!-- White stripe -->
    <rect x="16" y="0" width="16" height="48" fill="#FFFFFF"/>
    <!-- Red stripe -->
    <rect x="32" y="0" width="16" height="48" fill="#CE2B37"/>
    <!-- Savoy cross (simplified) in center white area -->
    <rect x="22" y="19" width="4" height="10" fill="#CE2B37"/>
    <rect x="19" y="22" width="10" height="4" fill="#CE2B37"/>
    <!-- White border around cross for Savoy shield feel -->
    <rect x="22.5" y="19.5" width="3" height="9" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    <rect x="19.5" y="22.5" width="9" height="3" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
  <circle cx="24" cy="24" r="23" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="0.5"/>
</svg>
