<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="15" fill="#f1c40f"/>
  <!-- Wheat stalk with grains -->
  <line x1="16" y1="26" x2="16" y2="10" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Grain pairs along the stalk -->
  <ellipse cx="13" cy="11" rx="2.5" ry="1.2" fill="#FFF" transform="rotate(-30 13 11)"/>
  <ellipse cx="19" cy="11" rx="2.5" ry="1.2" fill="#FFF" transform="rotate(30 19 11)"/>
  <ellipse cx="13.5" cy="14.5" rx="2.5" ry="1.2" fill="#FFF" transform="rotate(-25 13.5 14.5)"/>
  <ellipse cx="18.5" cy="14.5" rx="2.5" ry="1.2" fill="#FFF" transform="rotate(25 18.5 14.5)"/>
  <ellipse cx="14.5" cy="18" rx="2.2" ry="1" fill="#FFF" transform="rotate(-20 14.5 18)"/>
  <ellipse cx="17.5" cy="18" rx="2.2" ry="1" fill="#FFF" transform="rotate(20 17.5 18)"/>
  <!-- Tip grain -->
  <ellipse cx="16" cy="8" rx="1.5" ry="2.5" fill="#FFF"/>
</svg>
