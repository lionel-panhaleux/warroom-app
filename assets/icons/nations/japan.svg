      <polygon points="24,24 -9.3,17.4 -9.3,30.6"/>
      <polygon points="24,24 -4.3,42.9 5.1,52.3"/>
      <polygon points="24,24 17.4,57.3 30.6,57.3"/>
      <polygon points="24,24 42.9,52.3 52.3,42.9"/>
