<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <clipPath id="c-uk">
      <circle cx="24" cy="24" r="23"/>
    </clipPath>
  </defs>
  <g clip-path="url(#c-uk)">
    <!-- Blue background -->
    <rect width="48" height="48" fill="#012169"/>
    <!-- White diagonal cross -->
    <line x1="0" y1="0" x2="48" y2="48" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="48" y1="0" x2="0" y2="48" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Red diagonal cross -->
    <line x1="0" y1="0" x2="48" y2="48" stroke="#C8102E" stroke-width="2.5"/>
    <line x1="48" y1="0" x2="0" y2="48" stroke="#C8102E" stroke-width="2.5"/>
    <!-- White vertical/horizontal cross -->
    <line x1="24" y1="0" x2="24" y2="48" stroke="#FFFFFF" stroke-width="9"/>
    <line x1="0" y1="24" x2="48" y2="24" stroke="#FFFFFF" stroke-width="9"/>
    <!-- Red vertical/horizontal cross -->
    <line x1="24" y1="0" x2="24" y2="48" stroke="#C8102E" stroke-width="5"/>
    <line x1="0" y1="24" x2="48" y2="24" stroke="#C8102E" stroke-width="5"/>
  </g>
  <circle cx="24" cy="24" r="23" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="0.5"/>
</svg>
